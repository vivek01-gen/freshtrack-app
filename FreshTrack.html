<title>FreshTrack</title>
<style>
:root {
  --pista: #9ccf8b;
  --pista-dark: #7caf6d;
  --dark-green: #1b4d1f;
  --accent: #00c897;
  --accent2: #22c55e;
  --fresh: #22c55e;
  --fresh-bg: #dcfce7;
  --soon: #f59e0b;
  --soon-bg: #fef9c3;
  --today: #ef4444;
  --today-bg: #fee2e2;
  --expired: #dc2626;
  --expired-bg: #fecaca;
  --bg: #f7fff8;
  --surface: #ffffff;
  --text: #0f2f24;
  --muted: #4a6f62;
  --border: #dceadd;
  --surface-variant: #cfe8c9;
  --nav-bg: #9ccf8b;
  --nav-text: #1b4d1f;
  --fab-bg: #00c897;
  --radius: 24px;
  --font:
    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
    Cantarell, sans-serif;
}
.dark {
  --bg: #0f201b;
  --surface: #1b352b;
  --text: #e2e8f0;
  --muted: #8ba59b;
  --border: #264c3e;
  --surface-variant: #264c3e;
  --fresh-bg: #0d2818;
  --soon-bg: #2a1f06;
  --today-bg: #2a0f06;
  --expired-bg: #1a0a0a;
  --nav-bg: #9ccf8b;
  --nav-text: #1b4d1f;
}
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
body {
  font-family: var(--font);
  background: #e8f5e9;
  display: flex;
  justify-content: center;
  min-height: 100vh;
}
.app-container {
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 40px rgba(0, 0, 0, 0.08);
}
.screen {
  display: none;
  flex-direction: column;
  min-height: 100vh;
  animation: fadeIn 0.3s ease;
}
.screen.active {
  display: flex;
}
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@keyframes slideUp {
  from {
    transform: translateY(100%);
  }
  to {
    transform: translateY(0);
  }
}
@keyframes scaleIn {
  from {
    transform: scale(0.8);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
@keyframes toastIn {
  from {
    transform: translateY(100px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}
.splash-screen {
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg, #cfe8c9, #f7fff8);
  text-align: center;
  gap: 10px;
}
.splash-logo {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.52);
  border: 2px solid rgba(34, 197, 94, 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
}
.splash-logo svg {
  width: 100%;
  height: 100%;
}
.splash-title {
  font-size: 40px;
  font-weight: 900;
  color: var(--dark-green);
  letter-spacing: -2px;
}
.splash-tagline {
  font-size: 11px;
  color: #00c897;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.splash-spinner {
  width: 32px;
  height: 32px;
  border: 3px solid rgba(0, 200, 151, 0.2);
  border-top: 3px solid #00c897;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-top: 16px;
}
.onboard-screen {
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: linear-gradient(180deg, #cfe8c9, #f7fff8);
}
.onboard-card {
  max-width: 380px;
  width: 100%;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(20px);
  border-radius: 28px;
  padding: 28px 24px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
}
.dark .onboard-card {
  background: rgba(27, 53, 43, 0.95);
}
.onboard-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 20px;
}
.onboard-dots {
  display: flex;
  gap: 6px;
}
.onboard-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #cfe8c9;
  transition: all 0.2s;
}
.onboard-dot.active {
  width: 24px;
  border-radius: 4px;
  background: linear-gradient(90deg, #00c897, #22c55e);
}
.onboard-btn {
  border: none;
  padding: 10px 20px;
  border-radius: 14px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}
.onboard-btn.primary {
  background: linear-gradient(135deg, #00c897, #22c55e);
  color: #fff;
  box-shadow: 0 4px 12px rgba(0, 200, 151, 0.3);
}
.onboard-btn.primary:active {
  transform: scale(0.95);
}
.onboard-btn.secondary {
  background: rgba(0, 200, 151, 0.12);
  color: #00c897;
}
.app-header {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  gap: 10px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 20;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
}
.header-logo-box {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
}
.header-logo-box svg {
  width: 100%;
  height: 100%;
}
.header-text {
  flex: 1;
  min-width: 0;
}
.header-text h1 {
  font-size: 17px;
  font-weight: 900;
  color: var(--text);
  line-height: 1.2;
}
.header-text p {
  font-size: 10px;
  color: var(--muted);
  font-weight: 600;
  letter-spacing: 0.3px;
}
.header-spacer {
  flex: 1;
}
.header-theme-btn {
  width: 36px;
  height: 36px;
  border: none;
  border-radius: 12px;
  background: rgba(0, 200, 151, 0.1);
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}
.header-theme-btn:active {
  transform: scale(0.9);
}
.header-back {
  width: 36px;
  height: 36px;
  border: none;
  border-radius: 12px;
  background: rgba(0, 0, 0, 0.04);
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}
.dark .header-back {
  background: rgba(255, 255, 255, 0.08);
}
.header-back:active {
  transform: scale(0.9);
}
.main-scroll {
  flex: 1;
  overflow-y: auto;
  padding-bottom: 90px;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-around;
  padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px));
  z-index: 100;
  box-shadow: 0 -2px 20px rgba(0, 0, 0, 0.06);
}
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  border: none;
  background: none;
  cursor: pointer;
  padding: 4px 16px;
  border-radius: 16px;
  transition: all 0.2s;
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
  min-width: 72px;
  min-height: 48px;
  letter-spacing: 0.3px;
}
.nav-item.active {
  color: #00c897;
}
.nav-item:active {
  transform: scale(0.9);
}
.nav-icon {
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.nav-icon svg {
  width: 100%;
  height: 100%;
}
.nav-item.active .nav-icon {
  color: #00c897;
}
.fab {
  position: fixed;
  bottom: 76px;
  left: 50%;
  transform: translateX(-50%);
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: linear-gradient(135deg, #00c897, #22c55e);
  border: none;
  color: #fff;
  cursor: pointer;
  box-shadow: 0 6px 24px rgba(0, 200, 151, 0.45);
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  max-width: 480px;
}
.fab:active {
  transform: translateX(-50%) scale(0.9);
}
.fab .icon {
  width: 28px;
  height: 28px;
}
.stats-row {
  display: flex;
  gap: 10px;
  padding: 14px 16px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.stats-row::-webkit-scrollbar {
  display: none;
}
.stat-card {
  border-radius: 20px;
  padding: 14px;
  min-width: 140px;
  flex-shrink: 0;
  border: 1.5px solid;
  cursor: pointer;
  transition: all 0.2s;
}
.stat-card:active {
  transform: scale(0.96);
}
.stat-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.stat-icon {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  border: 1.5px solid;
  display: flex;
  align-items: center;
  justify-content: center;
}
.stat-icon .icon {
  width: 18px;
  height: 18px;
}
.stat-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}
.stat-count {
  font-size: 28px;
  font-weight: 900;
  line-height: 1.1;
}
.stat-label {
  font-size: 11px;
  font-weight: 700;
  margin-top: 4px;
  color: var(--text);
}
.stat-sub {
  font-size: 9px;
  color: var(--muted);
  margin-top: 1px;
}
.quick-actions {
  display: flex;
  gap: 6px;
  padding: 4px 16px 12px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.quick-actions::-webkit-scrollbar {
  display: none;
}
.quick-actions button {
  display: flex;
  align-items: center;
  gap: 7px;
  border: none;
  padding: 9px 16px;
  border-radius: 16px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
  flex-shrink: 0;
  min-height: 40px;
}
.quick-actions button:active {
  transform: scale(0.95);
}
.quick-actions button .icon {
  width: 16px;
  height: 16px;
}
.search-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 14px 10px;
  padding: 10px 16px;
  border-radius: 18px;
  background: var(--surface);
  border: 1.5px solid var(--border);
}
.dark .search-bar {
  background: var(--surface-variant);
}
.search-bar .search-icon {
  width: 18px;
  height: 18px;
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.search-bar .search-icon .icon {
  width: 18px;
  height: 18px;
}
.search-bar input {
  flex: 1;
  border: none;
  background: none;
  font-size: 13px;
  outline: none;
  color: var(--text);
  padding: 2px 0;
  min-height: 36px;
}
.search-bar input::placeholder {
  color: var(--muted);
}
.clear-btn {
  width: 24px;
  height: 24px;
  border: none;
  background: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  flex-shrink: 0;
}
.clear-btn svg {
  width: 14px;
  height: 14px;
}
.filter-row {
  display: flex;
  gap: 6px;
  padding: 0 16px 8px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.filter-row::-webkit-scrollbar {
  display: none;
}
.filter-chip {
  padding: 7px 16px;
  border-radius: 22px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
  min-height: 38px;
}
.filter-chip.active {
  background: #00c897;
  border-color: #00c897;
  color: #fff;
}
.filter-chip:active {
  transform: scale(0.95);
}
.filter-chip .icon {
  width: 14px;
  height: 14px;
}
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 16px 6px;
}
.section-header h3 {
  font-size: 16px;
  font-weight: 900;
  color: var(--text);
}
.section-header span {
  font-size: 10px;
  color: var(--muted);
  font-weight: 700;
}
.item-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 20px;
  margin: 6px 16px;
  padding: 14px;
  transition: all 0.2s;
}
.dark .item-card {
  background: var(--surface-variant);
}
.item-card:active {
  transform: scale(0.98);
}
.item-card-inner {
  display: flex;
  gap: 12px;
  flex-direction: column;
}
.item-card-top {
  display: flex;
  gap: 12px;
  flex: 1;
  min-width: 0;
}
.item-emoji-box {
  width: 56px;
  height: 56px;
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  background: var(--surface-variant);
}
.item-emoji-box .icon {
  width: 30px;
  height: 30px;
}
.item-emoji-box img {
  width: 50px;
  height: 50px;
  border-radius: 16px;
  object-fit: cover;
}
.item-info {
  flex: 1;
  min-width: 0;
}
.item-name {
  font-size: 16px;
  font-weight: 900;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.item-meta {
  font-size: 10px;
  color: var(--muted);
  margin-top: 2px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 4px;
}
.item-meta .icon {
  width: 10px;
  height: 10px;
}
.item-right {
  text-align: right;
  flex-shrink: 0;
}
.item-price {
  font-size: 16px;
  font-weight: 900;
  color: var(--text);
}
.item-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 3px 8px;
  border-radius: 8px;
  font-size: 9px;
  font-weight: 700;
  margin-top: 6px;
}
.item-card-actions {
  display: flex;
  gap: 4px;
  margin-top: 8px;
  padding-top: 6px;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}
.item-card-actions button {
  border: none;
  background: rgba(0, 0, 0, 0.04);
  border-radius: 10px;
  padding: 6px 10px;
  font-size: 10px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
  color: var(--muted);
  transition: all 0.2s;
  min-height: 36px;
}
.dark .item-card-actions button {
  background: rgba(255, 255, 255, 0.06);
}
.item-card-actions button:active {
  transform: scale(0.95);
}
.item-card-actions button .icon {
  width: 14px;
  height: 14px;
}
.empty-state {
  text-align: center;
  padding: 40px 20px;
  margin: 16px;
  border-radius: 24px;
  border: 1.5px dashed var(--border);
  background: var(--surface);
}
.dark .empty-state {
  background: rgba(27, 53, 43, 0.6);
}
.empty-state .empty-icon {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 12px;
  background: var(--fresh-bg);
}
.empty-state .empty-icon .icon {
  width: 40px;
  height: 40px;
}
.empty-state h3 {
  font-size: 16px;
  font-weight: 900;
  margin-bottom: 4px;
  color: var(--text);
}
.empty-state p {
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 16px;
}
.empty-cta {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: none;
  background: linear-gradient(135deg, #00c897, #22c55e);
  color: #fff;
  padding: 10px 20px;
  border-radius: 14px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 4px 12px rgba(0, 200, 151, 0.3);
  min-height: 36px;
}
.empty-cta:active {
  transform: scale(0.95);
}
.empty-cta .icon {
  width: 16px;
  height: 16px;
}
.sl-dcard {
  margin: 8px 16px;
  border-radius: 20px;
  border: 1.5px solid rgba(0, 200, 151, 0.2);
  background: var(--surface);
  padding: 14px 16px;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 2px 12px rgba(0, 200, 151, 0.08);
}
.sl-dcard:active {
  transform: scale(0.97);
}
.dark .sl-dcard {
  background: #131f1c;
  border-color: rgba(0, 200, 151, 0.1);
}
.sl-dicon {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  background: linear-gradient(
    135deg,
    rgba(0, 200, 151, 0.12),
    rgba(156, 207, 139, 0.2)
  );
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.sl-dicon .icon {
  width: 22px;
  height: 22px;
}
.sl-dheader {
  padding: 14px 16px 4px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.sl-dtitle {
  font-size: 18px;
  font-weight: 900;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.sl-dtitle .icon {
  width: 22px;
  height: 22px;
}
.sl-dcreate {
  border: none;
  background: linear-gradient(135deg, #00c897, #22c55e);
  color: #fff;
  border-radius: 14px;
  padding: 8px 14px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;

body,

@supports (min-height: 100dvh) {

  .app-container,
  .screen {

  }
}

body.modal-open .main-scroll {
  overflow: hidden;
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
.nav-item:focus-visible,
.theme-btn:focus-visible,
.accent-dot:focus-visible,
.font-btn:focus-visible,
.picker-chip:focus-visible,
.filter-chip:focus-visible,

.setting-row:focus-visible,
.lang-selector-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* ============ PRODUCTION POLISH ============ */

/* ============ PRODUCTION POLISH ============ */
:root {
  --radius-md: 14px;
  --radius-lg: 18px;
  --shadow-card: 0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.06);
  --shadow-float: 0 4px 16px rgba(0,0,0,.14);
}
html { -webkit-text-size-adjust: 100%; }
body { overflow-x: hidden; }

/* Typography scale: titles 22, section 17, body 15, caption 12 (dp) */
.header-title { font-size: clamp(17px, 4.6vw, 22px); font-weight: 900; letter-spacing: .2px; }
.page-title, .section-title { font-size: clamp(15px, 4.2vw, 17px); font-weight: 800; }
.body-copy { font-size: 15px; line-height: 1.5; }
.caption { font-size: 12px; line-height: 1.4; }
.stat-count { font-size: clamp(24px, 6vw, 30px) !important; }
.stat-label { font-size: 11px !important; }
.quick-action-label { font-size: 11px !important; }
.setting-row-label { font-size: 15px; }
.setting-row-sub { font-size: 12px; }
.settings-group-title { font-size: 12px; letter-spacing: .6px; }

/* 8dp grid spacing */
.settings-group { margin: 0 0 18px; }
.settings-card { border-radius: var(--radius-md); box-shadow: var(--shadow-card); }
.main-scroll { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
.stat-card, .quick-action, .item-card, .sl-card, .ana-card {
  border-radius: var(--radius-md);
}

/* Touch targets: min 44-48px */
.nav-item, .fab, .setting-row, .setting-action-btn, .sl-overflow-btn,
.quick-action, .sl-card-act, .sl-bg-act, .theme-btn, .font-btn,
.empty-cta, .btn, .onboard-btn, .accent-dot { min-height: 44px; }
.setting-action-btn { min-height: 48px; }
.nav-item { min-height: 56px; }

/* Bottom nav: Material-style active indicator + ripple */
.bottom-nav {
  box-shadow: 0 -1px 0 rgba(0,0,0,.06), 0 -4px 16px rgba(0,0,0,.06);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.nav-item {
  position: relative;
  transition: color .18s ease, transform .18s ease;
}
.nav-item:active { transform: scale(.92); }
.nav-item.active { color: var(--accent); }
.nav-item.active::before {
  content: "";
  position: absolute;
  top: 6px;
  left: 50%;
  width: 22px;
  height: 3px;
  border-radius: 99px;
  transform: translateX(-50%) scaleX(.4);
  background: var(--accent);
  opacity: 0;
  transition: transform .22s ease, opacity .22s ease;
}
.nav-item.active::before { opacity: 1; transform: translateX(-50%) scaleX(1); }
.nav-item.active .nav-icon { transform: translateY(-1px); }
.nav-item .nav-icon { transition: transform .22s ease; }
.bottom-nav button { border-radius: 12px; }

/* FAB */
.fab {
  width: 56px; height: 56px;
  box-shadow: var(--shadow-float);
  border-radius: 18px;
  transition: transform .18s ease, opacity .2s ease;
}
.fab:active { transform: scale(.9); }
.fab.keyboard-up { transform: translateY(120%); opacity: 0; pointer-events: none; }

/* Home polish */
.stats-row { gap: 10px; }
.stat-card { padding: 12px; transition: transform .16s ease; }
.stat-card:active { transform: scale(.97); }
.quick-actions { gap: 10px; }

/* Shopping overflow */
.sl-card-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 6px;
  padding: 8px 14px 10px;
}
.sl-overflow-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  min-width: 44px;
  border: none;
  border-radius: 12px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}
.sl-overflow-btn:active { background: rgba(0,0,0,.06); transform: scale(.9); }
.sl-overflow-btn .icon { width: 20px; height: 20px; }
.sl-card-actions .sl-drag-handle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  color: var(--muted);
  cursor: grab;
}

/* Support center */
.support-desc {
  font-size: 13px;
  line-height: 1.5;
  color: var(--muted);
  margin: 8px 4px 12px;
}
.faq-item {
  background: rgba(0,0,0,.03);
  border-radius: 12px;
  padding: 10px 12px;
  margin-bottom: 10px;
}
.faq-q {
  font-size: 13px;
  font-weight: 800;
  color: var(--text);
  display: flex;
  align-items: flex-start;
  gap: 6px;
}
.faq-q .icon { flex-shrink: 0; color: var(--accent); margin-top: 1px; }
.faq-a {
  font-size: 12.5px;
  line-height: 1.5;
  color: var(--muted);
  margin-top: 4px;
}
.contact-form { margin: 6px 2px 10px; }
.cf-label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 5px;
}
.contact-form .form-input { width: 100%; box-sizing: border-box; border-radius: 10px; }

/* About card */
.about-ft-card {
  text-align: center;
  padding: 18px 12px 12px;
}
.about-ft-logo {
  width: 64px;
  height: 64px;
  margin: 0 auto 10px;
  border-radius: 20px;
  background: linear-gradient(135deg, rgba(0,200,151,.16), rgba(34,197,94,.1));
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
}
.about-ft-name { font-size: 18px; font-weight: 900; color: var(--text); }
.about-ft-tag { font-size: 12px; color: var(--accent); font-weight: 700; margin-top: 2px; }
.about-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 4px;
  border-bottom: 1px solid rgba(0,0,0,.05);
  font-size: 13px;
}
.about-row span { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.about-row .icon { color: var(--accent); }
.about-row b { color: var(--text); font-weight: 700; }
.about-sep { height: 1px; background: rgba(0,0,0,.06); margin: 10px 0; }
.about-mission, .about-credits { padding: 4px; }
.about-mission-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 4px;
}
.about-mission-title .icon { color: var(--accent); }
.about-copyright {
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  margin-top: 12px;
}

/* Empty states */

      "FreshTrack இயல்பாகவே தனியுரிமை முதன்மையாக வடிவமைக்கப்பட்டுள்ளது. உங்கள் எல்லா தரவும் - சரக்கு பொருட்கள், ஷாப்பிங் பட்டியல்கள், புகைப்படங்கள் மற்றும் அமைப்புகள் - இந்த சாதனத்தில் உங்கள் உலாவியின் LocalStorage இல் மட்டுமே சேமிக்கப்படுகிறது. FreshTrack க்கு சேவையகங்கள் இல்லை: நீங்கள் உள்ளிடும் எதுவும் யாருடனும் பதிவேற்றப்படவோ, அனுப்பப்படவோ, விற்கப்படவோ அல்லது பகிரப்படவோ மாட்டாது. இந்த ஆப்ஸில் எந்த விதமான பகுப்பாய்வு, குக்கீகள் அல்லது கண்காணிப்பும் இல்லை. எல்லாம் உங்கள் உலாவியில் இருப்பதால், உலாவி சேமிப்பை அழிப்பது அல்லது வேறு உலாவி/சாதனத்தில் ஆப்ஸைத் திறப்பது இந்த ஆப்ஸிலிருந்து உங்கள் தரவை நீக்கும். உங்கள் தரவைப் பாதுகாக்க, அமைப்புகள், பிறகு ஆஃப்லைன் & தரவு, பிறகு காப்பு ஏற்றுமதி வழியாக அவ்வப்போது காப்புப்பிரதியை ஏற்றுமதி செய்யுங்கள். உங்கள் சொந்த காப்புப்பிரதிகளை வைத்திருப்பது உங்கள் பொறுப்பு. இந்த கொள்கை அவ்வப்போது புதுப்பிக்கப்படலாம்; மாற்றங்கள் இங்கே காட்டப்படும். கேள்விகளுக்கு, support@freshtrack.app ஐ தொடர்பு கொள்ளவும்.",
    termsText:
      "FreshTrack இலவசமாக, 'உள்ளபடியே' மற்றும் எந்த விதமான உத்தரவாதமும் இல்லாமல் வழங்கப்படுகிறது. FreshTrack ஐ உங்கள் சொந்த பொறுப்பில் பயன்படுத்துகிறீர்கள். இந்த ஆப்ளிகேஷனைப் பயன்படுத்துவதால் ஏற்படும் எந்த சேதம் அல்லது இழப்புக்கும் டெவலப்பர் பொறுப்பல்ல - கெட்டுப்போன உணவு, தவறிய காலாவதி தேதிகள், தரவு இழப்பு அல்லது மறைமுக சேதம் உள்ளிட்டவை. FreshTrack ஒரு நினைவூட்டல் மற்றும் ஒழுங்கமைப்பு கருவி மட்டுமே; இது உங்கள் சொந்த தீர்ப்பு, தொழில்முறை ஆலோசனை அல்லது உணவு பாதுகாப்பு நடைமுறைகளுக்கு மாற்றாக இல்லை. நியாயமான கவனத்துடன் செயல்படவும், உங்கள் தரவை காப்புப் பிரதி எடுக்கவும் ஒப்புக்கொள்கிறீர்கள். இந்த விதிமுறைகள் அவ்வப்போது புதுப்பிக்கப்படலாம்; ஆப்ஸை தொடர்ந்து பயன்படுத்தினால் சமீபத்திய பதிப்பை ஏற்றுக்கொண்டதாக அர்த்தம். கேள்விகளுக்கு, support@freshtrack.app ஐ தொடர்பு கொள்ளவும்.",
    safetyText:
      "உணவு பாதுகாப்பு உங்கள் பொறுப்பு. FreshTrack தேதிகளைக் கண்காணிக்க உதவுகிறது, ஆனால் எந்த உணவும் சாப்பிட பாதுகாப்பானது என்று உத்தரவாதம் அளிக்க முடியாது. அச்சிடப்பட்ட காலாவதி அல்லது சிறந்த-முன் தேதியை எப்போதும் சரிபார்க்கவும், உட்கொள்ளும் முன் உணவை வாசனை, நிறம், அமைப்பு மற்றும் பேக்கேஜிங் சேதத்திற்கு ஆய்வு செய்யவும். உங்கள் உள்ளூர் உணவு அதிகாரத்தின் அதிகாரப்பூர்வ உணவு பாதுகாப்பு வழிகாட்டுதல்களைப் பின்பற்றவும். சந்தேகம் இருந்தால், அதை தூக்கி எறியுங்கள். FreshTrack ஒரு நினைவூட்டல் கருவி மட்டுமே, தொழில்முறை ஆலோசனைக்கு மாற்றாக இல்லை. கேள்விகளுக்கு, support@freshtrack.app ஐ தொடர்பு கொள்ளவும்.",

      "FreshTrack స్వతహాగా గోప్యత-మొదటగా రూపొందించబడింది. మీ మొత్తం డేటా - ఇన్వెంటరీ వస్తువులు, షాపింగ్ జాబితాలు, ఫోటోలు మరియు సెట్టింగులు - ఈ పరికరంలో మీ బ్రౌజర్ LocalStorage లో మాత్రమే నిల్వ చేయబడుతుంది. FreshTrack కు సర్వర్లు లేవు: మీరు నమోదు చేసేది ఎవరితోనూ అప్‌లోడ్, ప్రసారం, విక్రయం లేదా భాగస్వామ్యం చేయబడదు. ఈ యాప్‌లో ఎలాంటి విశ్లేషణలు, కుకీలు లేదా ట్రాకింగ్ లేవు. ప్రతిదీ మీ బ్రౌజర్‌లో ఉన్నందున, బ్రౌజర్ స్టోరేజీని క్లియర్ చేయడం లేదా వేరే బ్రౌజర్/పరికరంలో యాప్‌ను తెరవడం ఈ యాప్ నుండి మీ డేటాను తీసివేస్తుంది. మీ డేటాను సురక్షితంగా ఉంచడానికి, సెట్టింగులు, ఆఫ్‌లైన్ & డేటా, బ్యాకప్ ఎగుమతి ద్వారా క్రమం తప్పకుండా బ్యాకప్ ఎగుమతి చేయండి. మీ స్వంత బ్యాకప్‌లను ఉంచుకోవడం మీ బాధ్యత. ఈ విధానం అప్పుడప్పుడు నవీకరించబడవచ్చు; మార్పులు ఇక్కడ చూపబడతాయి. ప్రశ్నలకు, support@freshtrack.app ను సంప్రదించండి.",

      "FreshTrack ఉచితంగా, 'ఉన్నట్లుగానే' మరియు ఎలాంటి హామీ లేకుండా అందించబడుతుంది. మీరు FreshTrack ను మీ స్వంత బాధ్యతపై ఉపయోగిస్తారు. ఈ అప్లికేషన్ వాడకం వల్ల తలెత్తే నష్టాలకు డెవలపర్ బాధ్యత వహించడు - చెడిపోయిన ఆహారం, తప్పిన గడువు తేదీలు, డేటా నష్టం లేదా పరోక్ష నష్టంతో సహా. FreshTrack ఒక రిమైండర్ మరియు సంస్థ సాధనం మాత్రమే; ఇది మీ స్వంత తీర్పు, వృత్తిపరమైన సలహా లేదా ఆహార భద్రతా పద్ధతులకు ప్రత్యామ్నాయం కాదు. సహేతుకమైన జాగ్రత్త తీసుకోవడానికి మరియు మీ స్వంత డేటాను బ్యాకప్ చేయడానికి మీరు అంగీకరిస్తారు. ఈ నిబంధనలు అప్పుడప్పుడు నవీకరించబడవచ్చు; యాప్‌ను కొనసాగించడం అంటే తాజా సంస్కరణను అంగీకరించినట్టే. ప్రశ్నలకు, support@freshtrack.app ను సంప్రదించండి.",
    safetyText:
      "ఆహార భద్రత మీ బాధ్యత. FreshTrack తేదీలను ట్రాక్ చేయడంలో సహాయపడుతుంది కానీ ఏ ఆహారం సురక్షితమని హామీ ఇవ్వలేదు. ఎల్లప్పుడూ ముద్రించిన గడువు లేదా బెస్ట్-బిఫోర్ తేదీని తనిఖీ చేయండి, తినే ముందు ఆహారాన్ని వాసన, రంగు, ఆకృతి మరియు ప్యాకేజింగ్ నష్టం కోసం పరిశీలించండి. మీ స్థానిక ఆహార అధికారం యొక్క అధికారిక ఆహార భద్రతా మార్గదర్శకాలను అనుసరించండి. సందేహం ఉంటే, విసిరేయండి. FreshTrack ఒక రిమైండర్ సాధనం మాత్రమే, వృత్తిపరమైన సలహాకు ప్రత్యామ్నాయం కాదు. ప్రశ్నలకు, support@freshtrack.app ను సంప్రదించండి.",

    privacyText:

    termsText:

    privacyText:
      "FreshTrack ডিফল্টভাবে গোপনীয়তা-প্রথম তৈরি করা হয়েছে। আপনার সমস্ত ডেটা - ইনভেন্টরি আইটেম, শপিং তালিকা, ফটো এবং সেটিংস - কেবল এই ডিভাইসের আপনার ব্রাউজারের LocalStorage-এ সংরক্ষিত থাকে। FreshTrack-এর কোনো সার্ভার নেই: আপনি যা লিখবেন তা কারো সাথে আপলোড, প্রেরণ, বিক্রি বা ভাগ করা হয় না। অ্যাপে কোনো বিশ্লেষণ, কুকি বা কোনো ধরনের ট্র্যাকিং নেই। যেহেতু সবকিছু আপনার ব্রাউজারে থাকে, ব্রাউজার স্টোরেজ মুছে ফেলা বা অন্য ব্রাউজার/ডিভাইসে অ্যাপ খোলার ফলে এই অ্যাপ থেকে আপনার ডেটা মুছে যাবে। আপনার ডেটা নিরাপদ রাখতে, সেটিংস, তারপর অফলাইন এবং ডেটা, তারপর ব্যাকআপ এক্সপোর্ট ব্যবহার করে নিয়মিত ব্যাকআপ এক্সপোর্ট করুন। নিজের ব্যাকআপ রাখার দায়িত্ব আপনার। এই নীতিটি সময়ে সময়ে আপডেট হতে পারে; কোনো পরিবর্তন এখানে দেখানো হবে। প্রশ্নের জন্য, support@freshtrack.app-এ যোগাযোগ করুন।",
    termsText:
      "FreshTrack বিনামূল্যে, 'যেমন আছে' এবং কোনো প্রকার ওয়ারেন্টি ছাড়াই প্রদান করা হয়। আপনি FreshTrack নিজ দায়িত্বে ব্যবহার করেন। এই অ্যাপ্লিকেশনটি ব্যবহারের ফলে সৃষ্ট কোনো ক্ষতি বা ক্ষতির জন্য ডেভেলপার দায়ী নয় - নষ্ট খাবার, মিস হওয়া মেয়াদ, ডেটা হারানো বা পরোক্ষ ক্ষতি সহ। FreshTrack শুধুমাত্র একটি অনুস্মারক এবং সংগঠনের সরঞ্জাম; এটি আপনার নিজের বিচার, পেশাদার পরামর্শ বা খাদ্য নিরাপত্তা অনুশীলনের বিকল্প নয়। আপনি যুক্তিসঙ্গত যত্ন নিতে এবং নিজের ডেটা ব্যাকআপ করতে সম্মত হন। এই শর্তাবলী সময়ে সময়ে আপডেট হতে পারে; অ্যাপ ব্যবহার চালিয়ে যাওয়া মানে সর্বশেষ সংস্করণ গ্রহণ করা। প্রশ্নের জন্য, support@freshtrack.app-এ যোগাযোগ করুন।",
    safetyText:
      "খাদ্য নিরাপত্তা আপনার দায়িত্ব। FreshTrack তারিখ ট্র্যাক করতে সাহায্য করে কিন্তু কোনো খাবার খাওয়া নিরাপদ তা নিশ্চিত করতে পারে না। সবসময় মুদ্রিত মেয়াদ বা সেরা-আগের তারিখ পরীক্ষা করুন এবং খাওয়ার আগে খাবারের গন্ধ, রঙ, গঠন এবং প্যাকেজিং ক্ষতি পরীক্ষা করুন। আপনার স্থানীয় খাদ্য কর্তৃপক্ষের অফিসিয়াল খাদ্য নিরাপত্তা নির্দেশিকা অনুসরণ করুন। সন্দেহ হলে ফেলে দিন। FreshTrack শুধুমাত্র একটি অনুস্মারক সরঞ্জাম এবং পেশাদার পরামর্শের বিকল্প নয়। প্রশ্নের জন্য, support@freshtrack.app-এ যোগাযোগ করুন।",

      "FreshTrack സൗജന്യമായും 'ഉള്ളതുപോലെ'യും ഒരു തരത്തിലുള്ള വാറന്റിയുമില്ലാതെയാണ് നൽകുന്നത്. നിങ്ങൾ FreshTrack സ്വന്തം ഉത്തരവാദിത്തത്തിൽ ഉപയോഗിക്കുന്നു. ഈ ആപ്പിന്റെ ഉപയോഗത്തിൽ നിന്ന് ഉണ്ടാകുന്ന ഏത് നാശനഷ്ടത്തിനും ഡെവലപ്പർ ഉത്തരവാദിയല്ല - കേടായ ഭക്ഷണം, നഷ്ടമായ കാലഹരണ തീയതികൾ, ഡാറ്റാ നഷ്ടം അല്ലെങ്കിൽ പരോക്ഷ നാശം എന്നിവ ഉൾപ്പെടെ. FreshTrack ഒരു ഓർമ്മപ്പെടുത്തൽ, സംഘാടന ഉപകരണം മാത്രമാണ്; ഇത് നിങ്ങളുടെ സ്വന്തം വിധിയുടെയോ പ്രൊഫഷണൽ ഉപദേശത്തിന്റെയോ ഭക്ഷ്യസുരക്ഷാ രീതികളുടെയോ പകരമല്ല. ന്യായമായ ശ്രദ്ധ പുലർത്താനും നിങ്ങളുടെ സ്വന്തം ഡാറ്റ ബാക്കപ്പ് ചെയ്യാനും നിങ്ങൾ സമ്മതിക്കുന്നു. ഈ നിബന്ധനകൾ ഇടയ്ക്കിടെ അപ്‌ഡേറ്റ് ചെയ്തേക്കാം; ആപ്പ് തുടർന്നും ഉപയോഗിക്കുന്നത് ഏറ്റവും പുതിയ പതിപ്പ് സ്വീകരിക്കുന്നതാണ്. ചോദ്യങ്ങൾക്ക്, support@freshtrack.app-ൽ ബന്ധപ്പെടുക.",
    safetyText:
      "ഭക്ഷ്യസുരക്ഷ നിങ്ങളുടെ ഉത്തരവാദിത്തമാണ്. FreshTrack തീയതികൾ ട്രാക്കുചെയ്യാൻ സഹായിക്കുന്നു, എന്നാൽ ഏത് ഭക്ഷണവും കഴിക്കാൻ സുരക്ഷിതമാണെന്ന് ഉറപ്പുനൽകാൻ കഴിയില്ല. അച്ചടിച്ച കാലഹരണ അല്ലെങ്കിൽ ബെസ്റ്റ്-ബിഫോർ തീയതി എപ്പോഴും പരിശോധിക്കുക, കഴിക്കുന്നതിന് മുമ്പ് ഭക്ഷണം മണം, നിറം, ഘടന, പാക്കേജിംഗ് കേടുപാടുകൾ എന്നിവ പരിശോധിക്കുക. നിങ്ങളുടെ പ്രാദേശിക ഭക്ഷ്യ അധികാരിയുടെ ഔദ്യോഗിക ഭക്ഷ്യസുരക്ഷാ മാർഗ്ഗനിർദ്ദേശങ്ങൾ പാലിക്കുക. സംശയമുണ്ടെങ്കിൽ, വലിച്ചെറിയുക. FreshTrack ഒരു ഓർമ്മപ്പെടുത്തൽ ഉപകരണം മാത്രമാണ്, പ്രൊഫഷണൽ ഉപദേശത്തിന് പകരമല്ല. ചോദ്യങ്ങൾക്ക്, support@freshtrack.app-ൽ ബന്ധപ്പെടുക.",

  n.setHours(0, 0, 0, 0);

      autoBackup: state.autoBackup,
      recentItems: state.recentItems,
    }),
  );
  if (state.autoBackup) {
    try {
      localStorage.setItem(
        "ftbackup_" + new Date().toISOString().slice(0, 10),
        localStorage.getItem("ftdata"),
      );
      var backupKeys = [];
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf("ftbackup_") === 0) backupKeys.push(k);

function handlePhoto(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function (ev) {
    window._photo = ev.target.result;
    var p = document.getElementById("photoPreview");
    p.innerHTML =
      '<img src=\"' +
      ev.target.result +
      '\" style=\"width:76px;height:76px;border-radius:18px;object-fit:cover\">';
  };
  reader.readAsDataURL(file);
}
function closeAddItem() {
  document.getElementById("addItemModal").classList.remove("show");
  setOverlayLock(false);
  state.editingItemId = null;
}
function saveItem() {
  var isEdit = state.editingItemId != null;
  var name = document.getElementById("fName").value.trim();
  var cat = window._selCat || "fruits_veg";
  var qty = parseFloat(document.getElementById("fQty").value) || 1;
  var unit = window._selUnit || "kg";
  var price = parseFloat(document.getElementById("fPrice").value) || null;
  if (price === 0) price = null;
  var bought = document.getElementById("fBought").value;
  var expiry = document.getElementById("fExpiry").value;
  var notes = document.getElementById("fNotes").value.trim();
  var photo = window._photo || null;
  if (!name) {
    var fe = document.getElementById("addFormError");
    fe.style.display = "block";
    fe.innerHTML = ics("alertTriangle", 14, 14) + " " + tr("nameRequired");
    return;
  }
  if (!expiry) {
    var fe = document.getElementById("addFormError");
    fe.style.display = "block";
    fe.innerHTML = ics("alertTriangle", 14, 14) + " " + tr("expiryRequired");
    return;
  }
  document.getElementById("addFormError").style.display = "none";
  if (isEdit) {
    var idx = state.items.findIndex(function (i) {
      return i.id === state.editingItemId;
    });
    if (idx >= 0)
      state.items[idx] = {
        id: state.editingItemId,
        name: name,
        category: cat,
        quantity: qty,
        unit: unit,
        price: price,
        boughtDate: bought,
        expiryDate: expiry,
        notes: notes,
        photoBase64: photo,
      };
  } else {
    state.items.push({
      id: nextItemId++,
      name: name,
      category: cat,
      quantity: qty,
      unit: unit,
      price: price,
      boughtDate: bought,
      expiryDate: expiry,
      notes: notes,
      photoBase64: photo,
    });
  }
  save();
  closeAddItem();
  state.editingItemId = null;
  renderHome();
  showToast(isEdit ? tr("itemUpdated") : tr("itemSaved"));
}

function curSym() {
  var syms = { INR: "₹", USD: "$", EUR: "€", GBP: "£", JPY: "¥", CNY: "¥" };
  return syms[state.currency] || "₹";
}
function pmask(v) {
  return state.privacyMode ? "••••" : v;
}
function slNorm(sl) {
  if (!sl) return sl;
  sl.items = sl.items || [];
  sl.title = sl.title || tr("shoppingList");
  sl.icon = sl.icon || "shoppingBag";
  sl.color = sl.color || "green";
  sl.budget = sl.budget || null;
  sl.createdAt = sl.createdAt || Date.now();
  sl.modifiedAt = sl.modifiedAt || sl.createdAt;
  sl.totalExpense = sl.totalExpense || 0;
  sl.isCompleted = !!sl.isCompleted;
  sl.completedAt = sl.completedAt || 0;
  sl.archived = !!sl.archived;
  sl.favorited = !!sl.favorited;
  sl.pinned = !!sl.pinned;
  sl.shared = !!sl.shared;
  sl.order = sl.order || 0;
  sl.note = sl.note || "";
  sl.items.forEach(function (it) {
    slItemNorm(it);
  });
  return sl;
}
function slItemNorm(it) {
  it.qty = it.qty || 1;
  it.unit = it.unit || "pieces";
  it.price = it.price || 0;
  it.notes = it.notes || "";
  it.category = it.category || "others";
  it.priority = it.priority || 0;
  it.checked = !!it.checked;
  it.favorited = !!it.favorited;
  it.addedAt = it.addedAt || Date.now();
  it.store = it.store || "";
  it.brand = it.brand || "";
  it.photo = it.photo || null;
  it.voice = it.voice || null;
  it.reminder = it.reminder || null;
  it.order = it.order || 0;
  return it;
}
function normalizeShoppingData() {
  (state.shoppingLists || []).forEach(slNorm);
  state.shoppingLists.forEach(function (sl, i) {
    if (!sl.order) sl.order = i;
  });
}
function getSL(id) {
  return (state.shoppingLists || []).find(function (s) {
    return s.id === id;
  });
}
function slTotal(items) {
  return items.reduce(function (a, i) {
    return a + (i.price || 0) * i.qty;
  }, 0);
}
function slSaveList(sl) {
  sl.modifiedAt = Date.now();
  sl.totalExpense = slTotal(sl.items || []);

}
function trackRecent(name) {
  if (!name) return;
  var r = state.recentItems;
  r = r.filter(function (x) {
    return x !== name;

  r.unshift(name);
  if (r.length > 20) r.length = 20;
  state.recentItems = r;
  save();
}
function isDuplicate(sl, name) {
  return (
    sl.items &&
    sl.items.some(function (i) {
      return i.name.toLowerCase() === name.toLowerCase();
    })
  );
}
function slDate(ts) {
  var d = new Date(ts);
  var dd = String(d.getDate()).padStart(2, "0");
  var mm = String(d.getMonth() + 1).padStart(2, "0");
  var yyyy = d.getFullYear();
  if (state.dateFormat === "MM/DD/YYYY") return mm + "/" + dd + "/" + yyyy;
  if (state.dateFormat === "YYYY-MM-DD") return yyyy + "-" + mm + "-" + dd;
  if (state.dateFormat === "DD.MM.YYYY") return dd + "." + mm + "." + yyyy;
  return dd + "/" + mm + "/" + yyyy;
}
function slTimeAgo(ts) {
  if (!ts) return "";
  var days = Math.floor((Date.now() - ts) / 86400000);
  if (days <= 0) return tr("today");
  if (days === 1) return tr("yesterday");
  return fmt(tr("daysAgoTpl"), { n: days });
}
function slDone(sl) {
  if (!sl) return;
  sl.modifiedAt = Date.now();
  sl.totalExpense = slTotal(sl.items || []);
  save();
}
function openShoppingList(id) {
  state.activeListId = id;
  renderShopping();
}
function closeShoppingList() {
  state.activeListId = null;
  renderShopping();
}
function slOpenById(id) {
  openShoppingList(id);
}

/* ---------------- LIST VIEW ---------------- */
function renderShopping() {
  applyTheme();
  refreshUI();
  setTimeout(function () {
    var sc = document.getElementById("shoppingScroll");
    if (sc) sc.scrollTo(0, 0);
  }, 10);
  ["shoppingShareBar", "shoppingSummary", "shoppingBottomActions"].forEach(
    function (id) {
      var el = document.getElementById(id);
      if (el) el.style.display = "none";
    },
  );
  var fab = document.getElementById("shopFab");
  if (fab) fab.style.display = "block";
  var c = document.getElementById("shoppingContent");
  if (!c) return;
  if (state.activeListId) {
    if (fab) fab.style.display = "none";
    renderShoppingDetail();
    return;
  }
  renderShoppingToolbar();
  c.innerHTML = "";
  var all = state.shoppingLists.slice();
  normalizeShoppingData();
  all = state.shoppingLists.slice();
  var sls = all
    .filter(function (sl) {
      return !sl.archived;
    })
    .filter(function (sl) {
      return slFilterMatch(sl);
    })
    .sort(function (a, b) {
      if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
      if (_slFilter === "alphabetical")
        return (a.title || "").localeCompare(b.title || "");
      if (_slFilter === "recent")
        return (b.modifiedAt || b.createdAt) - (a.modifiedAt || a.createdAt);
      return (b.modifiedAt || b.createdAt) - (a.modifiedAt || a.createdAt);
    });
  c.innerHTML +=
    '<div class="sl-dheader"><div><div class="sl-dtitle">' +
    ics("shoppingBag", 22, 22) +
    " " +
    tr("myLists") +
    '</div></div><button class="sl-dcreate" onclick="slNewList()">' +
    ics("plus", 14, 14) +
    " " +
    tr("create") +
    "</button></div>";
  if (sls.length === 0 && (state.shoppingLists || []).length === 0) {
    c.innerHTML += slEmptyState();
    return;
  }
  if (sls.length === 0) {
    c.innerHTML +=
      '<div class="sl-nofilter">' +
      ics("search", 28, 28) +
      "<div>" +
      tr("noFilterResults") +
      "</div></div>";
    return;
  }
  c.innerHTML += '<div id="slListWrap"></div>';
  sls.forEach(function (sl) {
    c.querySelector("#slListWrap").innerHTML += slCard(sl);
  });
  attachCardInteractions();
}
function slFilterMatch(sl) {
  if (_slSearch) {
    var q = _slSearch.toLowerCase();
    var hit =
      (sl.title || "").toLowerCase().indexOf(q) >= 0 ||
      (sl.items || []).some(function (it) {
        return (it.name || "").toLowerCase().indexOf(q) >= 0;
      });
    if (!hit) return false;
  }
  if (_slFilter === "completed" && !sl.isCompleted) return false;
  if (_slFilter === "incomplete" && sl.isCompleted) return false;
  if (_slFilter === "favorite" && !sl.favorited) return false;
  if (_slFilter === "archived" && !sl.archived) return false;
  if (_slFilter === "shared" && !sl.shared) return false;
  return true;
}
function renderShoppingToolbar() {
  var tb = document.getElementById("shoppingToolbar");
  if (!tb) return;
  tb.style.display = "block";
  var chips = [
    ["all", "all"],
    ["completed", "completed"],
    ["incomplete", "incomplete"],
    ["favorite", "favorite"],
    ["archived", "archived"],
    ["shared", "shared"],
    ["recent", "recent"],
    ["alphabetical", "alphabetical"],
  ];
  var html =
    '<div class="sl-toolbar-row"><span class="sl-toolbar-search-icon">' +
    ics("search", 14, 14) +
    '</span><input class="sl-toolbar-search" id="slSearchInput" placeholder="' +
    tr("searchLists") +
    '" value="' +
    esc(_slSearch) +
    '" oninput="slSearchOnInput(this.value)" onkeydown="if(event.key===\'Enter\')this.blur()"></div>';
  html += '<div class="sl-chips">';
  chips.forEach(function (chip) {
    html +=
      '<button class="sl-chip' +
      (_slFilter === chip[0] ? " active" : "") +
      '" onclick="slSetFilter(\'' +
      chip[0] +
      "')\">" +
      tr(chip[1]) +
      "</button>";
  });
  html += "</div>";
  tb.innerHTML = html;
}

function slPickIcon(btn, ic) {
  document.querySelectorAll(".sl-pick-ico").forEach(function (b) {
    b.classList.remove("active");
  });
  btn.classList.add("active");
}
function slPickColor(btn, c) {
  document.querySelectorAll(".sl-pick-color").forEach(function (b) {
    b.classList.remove("active");
    if (b.querySelector(".icon")) b.querySelector(".icon").remove();
  });
  btn.classList.add("active");
  btn.insertAdjacentHTML("beforeend", ics("check", 12, 12));
}
function slNewFromTemplate(tid) {
  var tpl = SL_TEMPLATES.find(function (t) {
    return t.id === tid;
  });
  if (!tpl) return;
  var ov = document.getElementById("dialogOverlay");
  if (ov && ov.classList.contains("show")) closeDialog();
  var sl = slNorm({
    id: nextListId++,
    title: tr(tpl.name),
    icon: tpl.icon,
    color: tpl.color,
    budget: null,
    items: [],
    createdAt: Date.now(),
    modifiedAt: Date.now(),
    totalExpense: 0,
    isCompleted: false,
    completedAt: 0,
    archived: false,
    favorited: false,
    pinned: false,
    shared: false,
    order: state.shoppingLists.length,
  });
  tpl.items.forEach(function (t) {
    sl.items.push(
      slItemNorm({
        id: nextShopItemId++,
        name: t.name,
        qty: t.qty,
        unit: t.unit,
        price: t.price,
        category: t.category,
      }),
    );
  });
  state.shoppingLists.push(sl);
  save();
  renderShopping();
  showToast(tr("listCreated"));
}

  slDone(sl);
  renderShopping();
  showToast(sl.favorited ? tr("listFavorited") : tr("listUnfavorited"));
}
function slPin(id) {
  var sl = getSL(id);
  if (!sl) return;
  sl.pinned = !sl.pinned;
  slDone(sl);
  renderShopping();
  showToast(sl.pinned ? tr("listPinned") : tr("listUnpinned"));
}
function slDuplicate(id) {
  var src = getSL(id);
  if (!src) return;
  var copy = JSON.parse(JSON.stringify(src));
  copy.id = nextListId++;
  copy.title = src.title + " (" + tr("copy") + ")";
  copy.createdAt = Date.now();
  copy.modifiedAt = Date.now();
  copy.archived = false;
  copy.isCompleted = false;
  copy.completedAt = 0;
  copy.order = state.shoppingLists.length;
  copy.items.forEach(function (it) {
    it.id = nextShopItemId++;
  });
  state.shoppingLists.push(slNorm(copy));
  save();
  renderShopping();
  showToast(tr("listDuplicated"));
}
function slArchiveById(id) {
  var sl = getSL(id);
  if (!sl) return;
  sl.archived = true;
  slDone(sl);
  renderShopping();
  showToast(tr("archived"));
}
function slDeleteById(id) {
  var sl = getSL(id);
  if (!sl) return;
  showDialog(
    tr("deleteList"),
    fmt(tr("deleteListConfirm"), { list: esc(sl.title) }),
    [
      { label: tr("cancel"), cls: "btn-cancel-d", fn: function () {} },
      {
        label: tr("delete"),
        cls: "btn-danger",
        fn: function () {
          var idx = state.shoppingLists.indexOf(sl);
          if (idx >= 0) state.shoppingLists.splice(idx, 1);
          if (state.activeListId === id) state.activeListId = null;
          _slListUndo = { sl: JSON.parse(JSON.stringify(sl)), idx: idx };
          save();
          renderShopping();
          showUndoToast(tr("listDeleted"), function () {
            slUndoDeleteList();
          });
        },
      },
    ],
  );
}
function slUndoDeleteList() {
  if (!_slListUndo) return;
  var u = _slListUndo;
  state.shoppingLists.splice(u.idx, 0, u.sl);
  _slListUndo = null;
  save();
  renderShopping();
  showToast(tr("restored"));
}
function slShareList(id) {
  var sl = getSL(id);
  if (!sl) return;
  var txt = sl.title + "\n" + slTextItems(sl);
  if (navigator.share) {
    navigator
      .share({ title: tr("appName") + " " + tr("shoppingList"), text: txt })
      .catch(function () {});
  } else {
    navigator.clipboard
      .writeText(txt)
      .then(function () {
        showToast(tr("textCopied"));
      })
      .catch(function () {
        showToast(tr("textCopied"));
      });
  }
}
function slTextItems(sl) {
  return (sl.items || [])
    .map(function (i) {
      return (
        (i.checked ? "[x]" : "[ ] ") +
        i.name +
        " x " +
        (i.qty || 1) +
        " " +
        i.unit +
        (i.price ? " @ " + curSym() + i.price : "")
      );
    })
    .join("\n");
}
function slExportList(id) {
  var sl = getSL(id);
  if (!sl) return;
  var csv =
    tr("itemName") +
    "," +
    tr("category") +
    "," +
    tr("qty") +
    "," +
    tr("unit") +
    "," +
    tr("priceShort") +
    "," +
    tr("notes") +
    "\n";
  (sl.items || []).forEach(function (i) {
    csv +=
      '"' +
      i.name +
      '","' +
      i.category +
      '",' +
      (i.qty || 1) +
      "," +
      i.unit +
      "," +
      (i.price || 0) +
      ',"' +
      (i.notes || "") +
      '"\n';
  });
  var blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "FreshTrack_" + sl.title.replace(/[^a-z0-9]/gi, "_") + ".csv";
  a.click();
  showToast(tr("csvExported"));
}

function attachCardSwipe(wrap, card, id) {
  var startX = 0,
    startY = 0,
    dx = 0,
    dy = 0,
    moved = false,
    longT = null;
  var MAX = 96;
  card.addEventListener("touchstart", function (e) {
    var t = e.touches[0];
    startX = t.clientX;
    startY = t.clientY;
    dx = 0;
    dy = 0;
    moved = false;
    card.classList.add("swipe-anim");
  });
  card.addEventListener(
    "touchmove",
    function (e) {
      var t = e.touches[0];
      dx = t.clientX - startX;
      dy = t.clientY - startY;
      if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) {
        moved = true;
        e.preventDefault();
        var tx = Math.max(-MAX, Math.min(MAX, dx));
        card.style.transform = "translateX(" + tx + "px)";
      }
    },
    { passive: false },
  );
  card.addEventListener("touchend", function () {
    if (moved) {
      _swipeSuppress = true;
      setTimeout(function () {
        _swipeSuppress = false;
      }, 350);
      if (dx > 60) {
        card.style.transform = "translateX(" + MAX + "px)";
        wrap.classList.add("swiped-right");
      } else if (dx < -60) {
        card.style.transform = "translateX(-" + MAX + "px)";
        wrap.classList.add("swiped-left");
      } else {
        card.style.transform = "translateX(0)";
      }
    } else {
      card.style.transform = "translateX(0)";
    }
  });
  card.addEventListener("click", function () {
    if (
      wrap.classList.contains("swiped-left") ||
      wrap.classList.contains("swiped-right")
    ) {
      wrap.classList.remove("swiped-left", "swiped-right");
      card.style.transform = "translateX(0)";
      if (e) e.stopPropagation();
    }
  });
}
function attachLongPress(el, fn) {
  var t = null;
  el.addEventListener(
    "touchstart",
    function () {
      t = setTimeout(fn, 480);
    },
    { passive: true },
  );
  el.addEventListener(
    "touchmove",
    function () {
      if (t) clearTimeout(t);
      t = null;
    },
    { passive: true },
  );
  el.addEventListener(
    "touchend",
    function () {
      if (t) clearTimeout(t);
      t = null;
    },
    { passive: true },
  );
  el.addEventListener("contextmenu", function (e) {
    e.preventDefault();
    fn();
  });
}

    e.dataTransfer.setData("text/plain", String(id));
    handle.classList.add("dragging");
  });
  handle.addEventListener("dragend", function () {
    handle.classList.remove("dragging");
  });
  wrap.addEventListener("dragover", function (e) {
    e.preventDefault();
    wrap.classList.add("drop-over");
  });
  wrap.addEventListener("dragleave", function () {
    wrap.classList.remove("drop-over");
  });
  wrap.addEventListener("drop", function (e) {
    e.preventDefault();
    wrap.classList.remove("drop-over");
    var from = e.dataTransfer.getData("text/plain");
    if (!from || from === id) return;
    slReorderLists(parseInt(from, 10), parseInt(id, 10));

function slReorderLists(fromId, toId) {
  var arr = state.shoppingLists.slice();

    return s.id === fromId;

  var toI = arr.findIndex(function (s) {
    return s.id === toId;
  });
  if (fromI < 0 || toI < 0) return;
  var item = arr.splice(fromI, 1)[0];
  arr.splice(toI, 0, item);
  state.shoppingLists = arr;
  state.shoppingLists.forEach(function (s, i) {
    s.order = i;
  });

  renderShopping();

        closeScanSheet();
        return;
      }
      video.srcObject = stream;
      video.setAttribute("playsinline", "");
      _scanDetector = new BarcodeDetector({
        formats: ["ean_13", "ean_8", "upc_a", "upc_e", "code_128", "qr_code"],
      });
      var scanTick = setInterval(function () {
        if (!document.getElementById("scanVideo")) {
          clearInterval(scanTick);

          .detect(video)

            if (codes && codes.length && codes[0].rawValue) {

    })
    .catch(function () {
      closeScanSheet();

    });

function slImportShopFile(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function (ev) {
    try {
      var lines = ev.target.result.split("\n").filter(function (l) {
        return l.trim();
      });
      var target = getSL(state.activeListId);
      if (!target) {
        target = slNorm({
          id: nextListId++,
          title: tr("shoppingList") + " " + (Date.now() % 1000),
          icon: "upload",
          color: "green",
          budget: null,
          items: [],
          createdAt: Date.now(),
          modifiedAt: Date.now(),
          totalExpense: 0,
          order: state.shoppingLists.length,
        });
        state.shoppingLists.push(target);
      }
      var start = lines[0].toLowerCase().includes("name") ? 1 : 0;
      for (var i = start; i < lines.length; i++) {
        var parts = lines[i].split(",");
        var name = (parts[0] || "").replace(/"/g, "").trim();
        if (!name) continue;
        target.items.push(
          slItemNorm({
            id: nextShopItemId++,
            name: name,
            qty: parseFloat(parts[2]) || 1,
            unit: parts[3] ? parts[3].replace(/"/g, "").trim() : "pieces",
            price: parseFloat(parts[4]) || 0,
            category: parts[1]
              ? parts[1].replace(/"/g, "").trim().toLowerCase()
              : "others",
            notes: parts[7] ? parts[7].replace(/"/g, "").trim() : "",
          }),
        );
      }
      slDone(target);
      renderShopping();
      showToast(tr("importSuccess"));
    } catch (ex) {
      showToast(tr("importFailed"));
    }
  };
  reader.readAsText(file);
  e.target.value = "";
}

function attachItemInteractions(sl) {
  if (!sl) return;
  document.querySelectorAll(".sl-item-row").forEach(function (row) {
    row.addEventListener("dragstart", function (e) {
      e.dataTransfer.setData("text/plain", row.id.replace("slItemRow_", ""));
      row.classList.add("dragging");
    });
    row.addEventListener("dragend", function () {
      row.classList.remove("dragging");
    });
    row.addEventListener("dragover", function (e) {
      e.preventDefault();
      row.classList.add("drop-over");
    });
    row.addEventListener("dragleave", function () {
      row.classList.remove("drop-over");
    });
    row.addEventListener("drop", function (e) {
      e.preventDefault();
      row.classList.remove("drop-over");
      var from = e.dataTransfer.getData("text/plain");
      if (!from || from === row.id.replace("slItemRow_", "")) return;
      slReorderItems(
        sl.id,
        parseInt(from, 10),
        parseInt(row.id.replace("slItemRow_", ""), 10),
      );
    });
  });
  document.querySelectorAll(".sl-group-head").forEach(function (head) {
    var drag = head.querySelector(".sl-group-drag");
    if (!drag) return;
    drag.addEventListener("dragstart", function (e) {
      e.dataTransfer.setData(
        "text/plain",
        "G:" + drag.getAttribute("data-cat"),
      );
      drag.classList.add("dragging");
    });
    drag.addEventListener("dragend", function () {
      drag.classList.remove("dragging");
    });
  });
  document.querySelectorAll(".sl-group").forEach(function (g) {
    g.addEventListener("dragover", function (e) {
      e.preventDefault();
      if (e.dataTransfer.getData("text/plain").indexOf("G:") === 0)
        g.classList.add("drop-over");
    });
    g.addEventListener("dragleave", function () {
      g.classList.remove("drop-over");
    });
    g.addEventListener("drop", function (e) {
      e.preventDefault();
      g.classList.remove("drop-over");
      var data = e.dataTransfer.getData("text/plain");
      if (data.indexOf("G:") === 0) {
        slReorderGroups(sl.id, data.slice(2), g.getAttribute("data-cat"));
      }
    });
  });
}
function slReorderItems(slId, fromId, toId) {
  var sl = getSL(slId);
  if (!sl) return;
  var fi = sl.items.findIndex(function (i) {
    return i.id === fromId;
  });
  var ti = sl.items.findIndex(function (i) {
    return i.id === toId;
  });
  if (fi < 0 || ti < 0) return;
  var it = sl.items.splice(fi, 1)[0];
  sl.items.splice(ti, 0, it);
  sl.items.forEach(function (x, i) {
    x.order = i;
  });
  slDone(sl);
  renderShoppingDetail();
}
function slReorderGroups(slId, fromCat, toCat) {
  var sl = getSL(slId);
  if (!sl) return;
  var cats = SL_CATS.slice();
  var fi = cats.indexOf(fromCat);
  var ti = cats.indexOf(toCat);
  if (fi < 0 || ti < 0) return;
  var c = cats.splice(fi, 1)[0];
  cats.splice(ti, 0, c);
  SL_CATS = cats;
  save();
  renderShoppingDetail();
}

function anaCountUp(el, target, fmt) {
  if (!el) return;
  var dur = 750;
  var t0 = null;
  function step(ts) {
    if (!t0) t0 = ts;
    var p = Math.min(1, (ts - t0) / dur);
    var ease = 1 - Math.pow(1 - p, 3);
    var val = target * ease;
    el.textContent = fmt ? fmt(val) : Math.round(val);
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function anaPieChart(data) {
  var total = data.reduce(function (a, d) {
    return a + d.value;
  }, 0);
  if (total <= 0) return '<div class="ana-empty">' + tr("noDataYet") + "</div>";
  var circ = 2 * Math.PI * 15.9;
  var offset = 0;
  var segs = "";
  data.forEach(function (d) {
    if (d.value <= 0) return;
    var frac = d.value / total;
    segs +=
      '<circle cx="21" cy="21" r="15.9" fill="none" stroke="' +
      d.color +
      '" stroke-width="3.8" stroke-linecap="round" stroke-dasharray="' +
      (frac * circ).toFixed(2) +
      " " +
      circ.toFixed(2) +
      '" stroke-dashoffset="' +
      (circ * 0.25 - offset).toFixed(2) +
      '" transform="rotate(-90 21 21)"><animate attributeName="stroke-dasharray" from="0 ' +
      circ.toFixed(2) +
      '" to="' +
      (frac * circ).toFixed(2) +
      " " +
      circ.toFixed(2) +
      '" dur="0.8s" fill="freeze" begin="0s"/></circle>';
    offset += frac * circ;
  });
  return (
    '<div class="ana-pie-wrap"><svg viewBox="0 0 42 42" class="ana-pie">' +
    '<circle cx="21" cy="21" r="15.9" fill="none" class="ana-pie-bg"/>' +
    segs +
    '<text x="21" y="21.5" text-anchor="middle" class="ana-pie-total">' +
    total +
    "</text></svg>" +
    '<div class="ana-legend">' +
    data
      .filter(function (d) {
        return d.value > 0;
      })
      .map(function (d) {
        return (
          '<div class="ana-legend-row"><span class="ana-legend-dot" style="background:' +
          d.color +
          '"></span><span class="ana-legend-label">' +
          d.label +
          '</span><span class="ana-legend-val">' +
          anaMoney(d.value) +
          "</span></div>"
        );
      })
      .join("") +
    "</div></div>"
  );
}
function anaLineChart(labels, values, color, suffix) {
  if (
    !values.length ||
    values.every(function (v) {
      return v === 0;
    })
  )
    return '<div class="ana-empty">' + tr("noDataYet") + "</div>";
  var W = 100,
    H = 36,
    pad = 2;
  var max = Math.max.apply(null, values) || 1;
  var step = values.length > 1 ? (W - pad * 2) / (values.length - 1) : 0;
  var pts = values
    .map(function (v, i) {
      return (
        (pad + i * step).toFixed(1) +
        "," +
        (H - pad - (v / max) * (H - pad * 2)).toFixed(1)
      );
    })
    .join(" ");
  var area =
    (pad + 0 * step).toFixed(1) +
    "," +
    (H - pad) +
    " " +
    pts +
    " " +
    (pad + (values.length - 1) * step).toFixed(1) +
    "," +
    (H - pad);
  var last = values[values.length - 1];
  return (
    '<div class="ana-line-wrap"><svg viewBox="0 0 ' +
    W +
    " " +
    H +
    '" preserveAspectRatio="none" class="ana-line"><defs><linearGradient id="anagrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="' +
    color +
    '" stop-opacity="0.35"/><stop offset="100%" stop-color="' +
    color +
    '" stop-opacity="0"/></linearGradient></defs><polygon points="' +
    area +
    '" fill="url(#anagrad)"/><polyline points="' +
    pts +
    '" fill="none" stroke="' +
    color +
    '" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="ana-line-axis">' +
    labels
      .map(function (l, i) {
        var show =
          values.length <= 6 ||
          i % Math.ceil(values.length / 6) === 0 ||
          i === values.length - 1;
        return (
          "<span" + (show ? "" : ' class="ana-axis-hide"') + ">" + l + "</span>"
        );
      })
      .join("") +
    '<span class="ana-line-last">' +
    suffix +
    last +
    "</span></div></div>"
  );
}

    pantry_grains: 0,
    beverages: 0,
    others: 0,
  };
  items.forEach(function (i) {
    if (cats[i.category] !== undefined)
      cats[i.category] += (i.price || 0) * (i.qty || i.quantity || 1);
  });
  var pieData = Object.keys(cats)
    .filter(function (k) {
      return cats[k] > 0;
    })
    .map(function (k) {
      return { label: catLabel(k), value: cats[k], color: catColors[k] };
    });
  c.innerHTML +=
    '<div class="analytics-card"><div class="ana-card-head">' +
    ics("pieChart", 16, 16) +
    " " +
    tr("categoryDistribution") +
    "</div>" +
    anaPieChart(pieData) +
    "</div>";
  // --- monthly waste (line) ---
  c.innerHTML +=
    '<div class="analytics-card"><div class="ana-card-head">' +
    ics("leaf", 16, 16) +
    " " +
    tr("monthlyWaste") +
    "</div>" +
    anaLineChart(
      tLabels,
      last6.map(function (m) {
        return months[m].waste;
      }),
      "#EF4444",
      cur,
    ) +
    "</div>";
  // --- weekly + monthly report ---
  var monthStart =
    now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
  var monthItems = items.filter(function (i) {
    var d = i.boughtDate || i.expiryDate;
    return d && d.slice(0, 7) === monthStart;
  });
  var monthSpend = monthItems.reduce(function (a, i) {
    return a + (i.price || 0) * (i.qty || i.quantity || 1);
  }, 0);
  var monthWaste = monthItems
    .filter(function (i) {
      return daysLeft(i.expiryDate) < 0;
    })
    .reduce(function (a, i) {
      return a + (i.price || 0) * (i.qty || i.quantity || 1);
    }, 0);

    '<div class="ana-2col">' +
    '<div class="analytics-card"><div class="ana-card-head">' +
    ics("calendar", 16, 16) +
    " " +

    tr("itemsAdded") +

    tr("totalValue") +
    '</div><div class="ana-value" data-anamoney="' +
    monthSpend +
    '">' +

    '0</div></div><div class="ana-col"><div class="ana-label">' +
    tr("wasted") +

    cur +
    "0</div></div></div></div>" +
    '<div class="analytics-card"><div class="ana-card-head">' +
    ics("trendingUp", 16, 16) +
    " " +
    tr("storageUsage") +
    '</div><div class="bar-chart" id="anaStorageChart"></div></div></div>';
  // storage usage per category
  var catCounts = {
    fruits_veg: 0,
    dairy_eggs: 0,
    bakery_bread: 0,
    meat_seafood: 0,
    pantry_grains: 0,
    beverages: 0,
    others: 0,
  };
  items.forEach(function (i) {
    if (catCounts[i.category] !== undefined) catCounts[i.category]++;
  });
  var maxCat = Math.max.apply(null, Object.values(catCounts)) || 1;
  var sc = "";
  Object.keys(catCounts).forEach(function (k) {
    if (catCounts[k] <= 0) return;
    sc +=
      '<div class="bar-row"><div class="bar-label">' +
      catLabel(k) +
      '</div><div class="bar-track"><div class="bar-fill" style="width:' +
      Math.round((catCounts[k] / maxCat) * 100) +

      (catColors[k] || "#64748B") +

      catCounts[k] +

    '<div class="analytics-card"><div class="ana-card-head">' +
    ics("trendingUp", 16, 16) +
    " " +
    tr("topExpiringItems") +
    '</div><div id="anaTopExpiring"></div></div>';
  var topExp = items
    .filter(function (i) {
      return i.expiryDate && !isNaN(daysLeft(i.expiryDate));
    })
    .sort(function (a, b) {
      return daysLeft(a.expiryDate) - daysLeft(b.expiryDate);
    })
    .slice(0, 5);
  var te = "";
  if (!topExp.length)
    te = '<div class="ana-empty">' + tr("noDataYet") + "</div>";
  topExp.forEach(function (i) {
    var dl = daysLeft(i.expiryDate);
    var st = getStatus(i.expiryDate);
    te +=
      '<div class="ana-top-row"><span class="ana-top-dot ' +
      st +
      '"></span><div class="ana-top-info"><div class="ana-top-name">' +
      esc(i.name) +
      '</div><div class="ana-top-meta">' +
      catLabel(i.category) +
      " · " +
      (dl < 0
        ? fmt(tr("daysAgoTpl"), { n: Math.abs(dl) })
        : dl === 0
          ? tr("expiresToday")
          : dl === 1
            ? tr("expiresTomorrow")
            : fmt(tr("daysLeftTpl"), { n: dl })) +
      '</div></div><div class="ana-top-val">' +
      anaMoney((i.price || 0) * (i.qty || i.quantity || 1)) +
      "</div></div>";
  });
  c.innerHTML +=
    '<div class="analytics-card"><div class="ana-card-head">' +
    ics("shoppingBag", 16, 16) +
    " " +
    tr("mostPurchased") +
    '</div><div id="anaMostPurchased"></div></div>';
  var nameCount = {};
  items.forEach(function (i) {
    var k = (i.name || "").toLowerCase();
    if (!k) return;
    if (!nameCount[k]) nameCount[k] = { name: i.name, n: 0, spend: 0 };
    nameCount[k].n++;
    nameCount[k].spend += (i.price || 0) * (i.qty || i.quantity || 1);
  });
  var mp = Object.keys(nameCount)
    .map(function (k) {
      return nameCount[k];
    })
    .sort(function (a, b) {
      return b.n - a.n;
    })
    .slice(0, 5);
  var mpHtml = "";
  if (!mp.length)
    mpHtml = '<div class="ana-empty">' + tr("noDataYet") + "</div>";
  mp.forEach(function (i, idx) {
    mpHtml +=
      '<div class="ana-top-row"><span class="ana-rank">' +
      (idx + 1) +
      '</span><div class="ana-top-info"><div class="ana-top-name">' +
      esc(i.name) +
      '</div><div class="ana-top-meta">' +
      i.n +
      " " +
      tr("items") +
      '</div></div><div class="ana-top-val">' +
      anaMoney(i.spend) +
      "</div></div>";
  });
  c.innerHTML +=
    '<div class="analytics-card"><div class="ana-card-head">' +
    ics("clock", 16, 16) +
    " " +
    tr("purchaseHistory") +
    '</div><div id="anaPurchaseHistory"></div></div>';
  var ph = items
    .filter(function (i) {
      return i.boughtDate;
    })
    .sort(function (a, b) {
      return (b.boughtDate || "").localeCompare(a.boughtDate || "");
    })
    .slice(0, 8);
  var phHtml = "";
  if (!ph.length)
    phHtml = '<div class="ana-empty">' + tr("noDataYet") + "</div>";
  ph.forEach(function (i) {
    var d = i.boughtDate.split("-");
    var label = d.length === 3 ? d[2] + "/" + d[1] + "/" + d[0] : i.boughtDate;
    phHtml +=
      '<div class="ana-top-row"><span class="ana-top-date">' +
      label +
      '</span><div class="ana-top-info"><div class="ana-top-name">' +
      esc(i.name) +
      '</div><div class="ana-top-meta">' +
      catLabel(i.category) +
      '</div></div><div class="ana-top-val">' +
      anaMoney((i.price || 0) * (i.qty || i.quantity || 1)) +
      "</div></div>";
  });
  c.innerHTML +=
    '<div style="margin:8px 16px;display:flex;gap:8px;flex-wrap:wrap"><button class="backup-btn" onclick="exportAnalyticsCSV()" style="text-align:center">' +
    ics("download", 14, 14) +
    " " +
    tr("exportCSVReport") +
    "</button></div>";
  document.getElementById("anaStorageChart").innerHTML =
    sc ||
    '<div style="font-size:10px;color:var(--muted);text-align:center;padding:12px">' +
      tr("noDataYet") +
      "</div>";
  document.getElementById("anaTopExpiring").innerHTML = te;
  document.getElementById("anaMostPurchased").innerHTML = mpHtml;
  document.getElementById("anaPurchaseHistory").innerHTML = phHtml;
  document.querySelectorAll("[data-anatarget]").forEach(function (el) {
    anaCountUp(el, parseFloat(el.getAttribute("data-anatarget")));
  });
  document.querySelectorAll("[data-anamoney]").forEach(function (el) {
    anaCountUp(el, parseFloat(el.getAttribute("data-anamoney")), function (v) {
      return cur + Math.round(v).toLocaleString();
    });
  });
}
function exportAnalyticsCSV() {
  var csv =
    tr("spendReport") +
    "\n" +
    tr("csvSpendHeader") +
    "\n" +
    state.items.reduce(function (a, i) {
      return a + (i.price || 0) * (i.qty || i.quantity || 1);
    }, 0) +
    "," +
    state.items.length +
    "," +
    state.items
      .filter(function (i) {
        return daysLeft(i.expiryDate) < 0;
      })
      .reduce(function (a, i) {
        return a + (i.price || 0) * (i.qty || i.quantity || 1);
      }, 0) +
    "\n\n" +
    tr("itemName") +
    "," +
    tr("category") +
    "," +
    tr("qty") +
    "," +
    tr("unit") +
    "," +
    tr("priceShort") +
    "," +
    tr("purchaseDate") +
    "," +
    tr("expiryDate") +
    "," +
    tr("notes") +
    "\n";
  state.items.forEach(function (i) {
    csv +=
      '"' +
      String(i.name || "").replace(/"/g, '""') +
      '","' +
      catLabel(i.category) +
      '",' +
      (i.qty || i.quantity || 1) +
      "," +
      (i.unit || "") +
      "," +
      (i.price || 0) +
      "," +
      (i.boughtDate || "") +
      "," +
      (i.expiryDate || "") +
      "," +
      String(i.notes || "").replace(/"/g, '""') +
      "\n";
  });
  var blob = new Blob([csv], { type: "text/csv" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "FreshTrack_Analytics.csv";
  a.click();
  showToast(tr("csvExported"));
}

function importCSV(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function (ev) {
    try {
      var lines = ev.target.result.split("\n").filter(function (l) {
        return l.trim();
      });
      var imported = 0;
      var start = lines[0].toLowerCase().includes("name") ? 1 : 0;
      for (var i = start; i < lines.length; i++) {
        var parts = lines[i].split(",");
        if (parts.length < 2) continue;
        var name = parts[0].replace(/"/g, "").trim();
        if (!name) continue;
        var cat = parts[1]
          ? parts[1].replace(/"/g, "").trim().toLowerCase()
          : "others";
        var qty = parseFloat(parts[2]) || 1;
        var unit = parts[3] ? parts[3].replace(/"/g, "").trim() : "pieces";
        var price = parseFloat(parts[4]) || null;
        if (price === 0) price = null;
        var bought = parts[5] ? parts[5].replace(/"/g, "").trim() : todayStr;
        var expiry = parts[6] ? parts[6].replace(/"/g, "").trim() : todayStr;
        var notes = parts[7] ? parts[7].replace(/"/g, "").trim() : "";
        state.items.push({
          id: nextItemId++,
          name: name,
          category: cat,
          quantity: qty,
          unit: unit,
          price: price,
          boughtDate: bought,
          expiryDate: expiry,
          notes: notes,
        });
        imported++;
      }
      save();
      renderHome();
      showToast(tr("importSuccess") + " " + imported + " items!");
    } catch (ex) {
      showToast(tr("importFailed"));
    }
  };
  reader.readAsText(file);
  e.target.value = "";
}

    green: "#22C55E",
    blue: "#3B82F6",
    purple: "#8B5CF6",
    orange: "#F97316",
  };
  var c = colors[state.accentColor] || "#22C55E";
  document.documentElement.style.setProperty("--accent", c);
  document.documentElement.style.setProperty("--fab-bg", c);
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", state.isDark ? "#0F201B" : c);
}
function applyFont() {
  var sizes = { s: "12px", m: "14px", l: "16px" };
  var sz = sizes[state.fontSize] || "14px";
  var cc = document.querySelector(".app-container");
  if (cc) cc.style.fontSize = sz;
}
function resetSettings() {
  showDialog(tr("resetSettings"), tr("resetSettingsConfirm"), [
    { label: tr("cancel"), cls: "btn-cancel-d", fn: function () {} },
    {
      label: tr("confirm"),
      cls: "btn-danger",
      fn: function () {
        state.currency = "INR";
        state.dateFormat = "DD/MM/YYYY";
        state.measureUnit = "metric";
        state.accentColor = "green";
        state.fontSize = "m";
        state.notificationTime = "10:00";
        state.reminderDays = [3];
        state.notificationsOn = true;
        state.appLock = false;
        state.lockPIN = "";
        state.privacyMode = false;
        state.autoBackup = false;
        state.themeMode = "light";
        state.isDark = false;
        applyTheme();
        applyAccent();
        applyFont();
        save();
        renderSettings();
        showToast(tr("settingsReset"));
      },
    },
  ]);
}
function clearCache() {
  showDialog(tr("clearCache"), tr("clearCacheConfirm"), [
    { label: tr("cancel"), cls: "btn-cancel-d", fn: function () {} },
    {
      label: tr("confirm"),
      cls: "btn-danger",
      fn: function () {
        localStorage.removeItem("ftdata");
        state.items = [];
        state.shoppingLists = [];
        nextItemId = 1;
        nextListId = 1;
        nextShopItemId = 1;
        save();
        showToast(tr("cacheCleared"));
        navigate("home");
      },
    },
  ]);
}

var CAT_ICON = {
  fruits_veg: "shopping",
  dairy_eggs: "package",
  bakery_bread: "package",
  meat_seafood: "tag",
  pantry_grains: "package",
  beverages: "shopping",
  others: "tag",
};
var deferredInstallPrompt = null;
var pwaInstalled = false;

function initPWA() {
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferredInstallPrompt = e;
    renderSettings();
  });
  window.addEventListener("appinstalled", function () {
    pwaInstalled = true;
    deferredInstallPrompt = null;
    showToast(tr("appReadyOffline"));
    renderSettings();
  });
  var updateOnline = function () {
    var el = document.getElementById("offlineBanner");
    if (el) {
      if (!navigator.onLine) {
        el.innerHTML = "<span>" + tr("youAreOffline") + "</span>";
        el.style.display = "flex";
      } else {
        el.style.display = "none";
      }
    }
    if (state.currentView === "settings") {
      renderSettings();
    }
  };
  window.addEventListener("online", updateOnline);
  window.addEventListener("offline", updateOnline);
  updateOnline();
  registerSW();
  if (
    window.matchMedia &&
    window.matchMedia("(display-mode: standalone)").matches
  ) {
    pwaInstalled = true;
  }
  scheduleReminderCheck();
}

function toggleNotifications(el) {
  state.notificationsOn = !state.notificationsOn;
  if (state.notificationsOn) {
    requestNotifPermission();
  }
  if (el) el.classList.toggle("on", state.notificationsOn);
  save();
  scheduleReminderCheck();
}

function requestNotifPermission() {
  if (!("Notification" in window)) {
    showToast(tr("notifUnsupported"));
    return;
  }
  if (Notification.permission === "granted") return;
  if (Notification.permission === "denied") {
    showToast(tr("notifDenied"));
    return;
  }
  Notification.requestPermission().then(function (p) {
    if (p === "granted") {
      showToast(tr("notifEnabled"));
      scheduleReminderCheck();
    } else {
      state.notificationsOn = false;
      save();
      showToast(tr("notifDenied"));
      if (state.currentView === "settings") renderSettings();
    }
  });
}

var _reminderTimer = null;
var _lastNotifDay = "";

function scheduleReminderCheck() {
  clearTimeout(_reminderTimer);
  _reminderTimer = null;
  if (!state.notificationsOn) return;
  if (!("Notification" in window)) return;
  var parts = String(state.notificationTime || "10:00").split(":");
  var hour = parseInt(parts[0], 10) || 10;
  var min = parseInt(parts[1], 10) || 0;
  var now = new Date();
  var target = new Date(
    now.getFullYear(),
    now.getMonth(),
    now.getDate(),
    hour,
    min,
    0,
    0,
  );
  var wait = target.getTime() - now.getTime();
  if (wait <= 0) wait += 24 * 60 * 60 * 1000;
  _reminderTimer = setTimeout(fireExpiryReminders, wait + 1000);
}

function fireExpiryReminders() {
  if (!state.notificationsOn) return;
  var today = new Date();
  var dayKey = today.toDateString();
  if (_lastNotifDay === dayKey) {
    scheduleReminderCheck();
    return;
  }
  var dl = state.reminderDays || [3];
  var due = (state.items || []).filter(function (it) {
    var d = daysLeft(it.expiryDate);
    return dl.indexOf(d) >= 0;
  });
  if (due.length) {
    var names = due
      .slice(0, 5)
      .map(function (it) {
        return it.name;
      })
      .join(", ");
    var body = due.length + " " + tr("itemsExpiringSoon") + ": " + names;
    if (Notification.permission === "granted") {
      try {
        var n = new Notification(tr("expiryReminder"), {
          body: body,
          tag: "freshtrack-expiry",
          requireInteraction: false,
        });
        n.onclick = function () {
          window.focus();
          navigate("home");
        };
        _lastNotifDay = dayKey;
      } catch (e) {}
    } else {
      showToast(body);
      _lastNotifDay = dayKey;
    }
  }
  scheduleReminderCheck();
}

function installApp() {
  if (!deferredInstallPrompt) {
    showToast(tr("installFailed"));
    return;
  }
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.then(function (choice) {
    if (choice.outcome === "accepted") {
      pwaInstalled = true;
      showToast(tr("appReadyOffline"));
      renderSettings();
    }
    deferredInstallPrompt = null;
  });
}
function registerSW() {
  if (!("serviceWorker" in navigator)) return;
  var swCode =
    "self.addEventListener('install',function(e){self.skipWaiting();e.waitUntil(caches.open('freshtrack-v1').then(function(c){return c.addAll(['./FreshTrack.html','./']);}).catch(function(){}));});" +
    "self.addEventListener('activate',function(e){e.waitUntil(self.clients.claim());});" +
    "self.addEventListener('fetch',function(e){e.respondWith(caches.match(e.request,{ignoreSearch:true}).then(function(r){if(r)return r;return fetch(e.request).then(function(res){if(res&&res.ok&&e.request.method==='GET'){var cl=res.clone();caches.open('freshtrack-v1').then(function(c){c.put(e.request,cl);}).catch(function(){});}return res;}).catch(function(){return caches.match('./FreshTrack.html');});}));});";
  var blob = new Blob([swCode], { type: "text/javascript" });
  var url = URL.createObjectURL(blob);
  navigator.serviceWorker
    .register(url, { scope: "./" })
    .then(function () {})
    .catch(function () {});
}

function fillStaticIcons() {
  var map = [
    [document.querySelectorAll(".header-back"), "back"],
    [document.querySelectorAll("#fabAdd .icon"), "plus"],
    [document.querySelectorAll("#shopFab .icon"), "plusCircle"],
    [document.querySelectorAll(".legal-close .icon"), "x"],
    [document.querySelectorAll(".quick-actions button"), "quickActions"],
  ];
  map.forEach(function (pair) {
    var els = pair[0];
    if (!els || !els.length) return;
    if (pair[1] === "quickActions") {
      var ids = ["bulkDeleteLabel", "csvLabel", "importCsvLabel"];
      var names = ["trash2", "download", "upload"];
      els.forEach(function (b, i) {
        var sp = b.querySelector(".icon");
        if (sp && ids[i] && document.getElementById(ids[i])) {
          sp.innerHTML = ICONS[names[i]];
        }
      });
      return;
    }
    els.forEach(function (el) {
      var sp = el.querySelector(".icon") || el;
      if (sp) sp.innerHTML = ICONS[pair[1]];
    });
  });
}

fillStaticIcons();
initPWA();
load();
applyTheme();
refreshUI();

/* ---------- FAB hides when on-screen keyboard is up ---------- */
function setupFabKeyboardHiding() {
  var fab = document.getElementById("fabAdd");
  if (!fab) return;
  var toggle = function (up) {
    if (up) fab.classList.add("keyboard-up");
    else fab.classList.remove("keyboard-up");
  };
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", function () {
      var shrink = window.innerHeight - window.visualViewport.height > 120;
      toggle(shrink);
    });
  }
  var activeEl = null;
  document.addEventListener(
    "focusin",
    function (e) {
      activeEl = e.target;
      if (
        activeEl &&
        (activeEl.tagName === "INPUT" ||
          activeEl.tagName === "TEXTAREA" ||
          activeEl.tagName === "SELECT")
      ) {
        toggle(true);
      }
    },
    true,
  );
  document.addEventListener("focusout", function () {
    activeEl = null;
    toggle(false);
  });
}
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", setupFabKeyboardHiding);
} else {
  setupFabKeyboardHiding();
}
